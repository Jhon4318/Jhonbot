name: Validate Bedrock Bot Console

on:
  push:
    branches:
      - "main"
      - "fix/friend-world-signalling-diagnostics-0.4.6"
      - "fix/xbox-signalling-order-0.4.7"
      - "fix/legacy-signal-frame-diagnostics-0.4.8"
      - "fix/app-version-display-and-frame-code-0.4.9"
      - "fix/xbox-connectiontype-routing-0.4.10"
      - "chore/quiet-friend-world-logs-0.4.11"
      - "feature/chat-inventory-drop-0.5.0"
      - "feature/account-subclients-0.6.0"
      - "fix/snappy-compression-0.6.1"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pinned dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm install --no-audit --no-fund

      - name: Run syntax checks and unit tests
        run: npm run check

  windows-package:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/fix/snappy-compression-0.6.1'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run syntax checks and unit tests
        run: npm run check

      - name: Build Windows x64 NSIS installer
        run: npm run dist:win

      - name: Create manual application update package
        shell: pwsh
        run: ./scripts/create-manual-update-package.ps1 -DistDirectory dist

      - name: Verify short-path manual update package
        shell: pwsh
        run: ./scripts/verify-manual-update-package.ps1 -UpdateZip (Get-ChildItem -Path dist -Filter '*-Update-*.zip' -File | Select-Object -First 1).FullName

      - name: Verify manual update package
        shell: pwsh
        run: |
          $updates = @(Get-ChildItem -Path dist -Filter '*-Update-*.zip' -File)
          if ($updates.Count -ne 1) {
            throw "Expected one manual update ZIP, found $($updates.Count)."
          }
          $checkDir = Join-Path $env:RUNNER_TEMP 'jhonbot-update-verify'
          if (Test-Path $checkDir) { Remove-Item $checkDir -Recurse -Force }
          Expand-Archive -LiteralPath $updates[0].FullName -DestinationPath $checkDir
          if (!(Test-Path (Join-Path $checkDir 'resources/app.asar'))) {
            throw "Update ZIP is missing app.asar."
          }
          if (!(Test-Path (Join-Path $checkDir 'Apply-Update.bat'))) {
            throw "Update ZIP is missing its launcher."
          }
          Write-Host "Verified $($updates[0].Name) ($($updates[0].Length) bytes)."

      - name: Upload Windows installer and manual update package
        uses: actions/upload-artifact@v4
        with:
          name: Bedrock-Bot-Console-0.6.1-Windows-x64
          path: |
            dist/Bedrock-Bot-Console-Setup.exe
            dist/Bedrock-Bot-Console-Update-0.6.1.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
