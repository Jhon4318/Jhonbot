name: Extract source from release ZIP

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "Bedrock-Bot-Console-Prototype-0.3.4.zip"
      - ".github/workflows/extract-source.yml"

permissions:
  contents: write

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Extract source files
        run: |
          mkdir -p /tmp/jhonbot-release docs
          unzip -q Bedrock-Bot-Console-Prototype-0.3.4.zip -d /tmp/jhonbot-release
          release=/tmp/jhonbot-release/bedrock-bot-console-0.3.4
          test -f "$release/package.json"
          cp -a "$release/src" ./src
          cp -a "$release/scripts" ./scripts
          cp -a "$release/test" ./test
          cp "$release/package.json" ./package.json
          cp "$release/start.bat" ./start.bat
          cp "$release/.gitignore" ./.gitignore
          cp "$release/README.md" ./docs/README-0.3.4.md

      - name: Validate extracted source
        run: npm run check

      - name: Commit extracted source to the PR branch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore package.json start.bat src scripts test docs/README-0.3.4.md
          if git diff --cached --quiet; then
            echo "The extracted source already matches the repository."
            exit 0
          fi
          git commit -m "chore: expose 0.3.4 source files"
          git push origin "HEAD:$BRANCH_NAME"
