name: Build Windows Installer and Manual Update

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "src/**"
      - "scripts/**"
      - "test/**"
      - "README.md"
      - ".github/workflows/package-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run syntax checks and unit tests
        run: npm run check

      - name: Build Windows x64 NSIS installer
        run: npm run dist:win

      - name: Create manual application update package
        shell: pwsh
        run: ./scripts/create-manual-update-package.ps1 -DistDirectory dist

      - name: Verify installer and manual update package
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path dist -Filter '*.exe' -File)
          $updates = @(Get-ChildItem -Path dist -Filter '*-Update-*.zip' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one installer, found $($installers.Count)."
          }
          if ($installers[0].Length -lt 10000000) {
            throw "Installer is unexpectedly small ($($installers[0].Length) bytes)."
          }
          if ($updates.Count -ne 1 -or $updates[0].Length -lt 1000000) {
            throw "Manual update ZIP is missing or unexpectedly small."
          }
          $checkDir = Join-Path $env:RUNNER_TEMP 'jhonbot-update-verify'
          if (Test-Path $checkDir) { Remove-Item $checkDir -Recurse -Force }
          Expand-Archive -LiteralPath $updates[0].FullName -DestinationPath $checkDir
          if (!(Test-Path (Join-Path $checkDir 'resources/app.asar'))) {
            throw "Manual update ZIP does not contain resources/app.asar."
          }
          if (!(Test-Path (Join-Path $checkDir 'Apply-Update.bat'))) {
            throw "Manual update ZIP does not contain Apply-Update.bat."
          }
          if (!(Test-Path (Join-Path $checkDir 'Apply-Update.ps1'))) {
            throw "Manual update ZIP does not contain Apply-Update.ps1."
          }
          if (!(Test-Path (Join-Path $checkDir 'update-manifest.json'))) {
            throw "Manual update ZIP does not contain update-manifest.json."
          }
          Write-Host "Verified $($installers[0].Name) ($($installers[0].Length) bytes) and $($updates[0].Name) ($($updates[0].Length) bytes)."

      - name: Verify short-path manual update package
        shell: pwsh
        run: ./scripts/verify-manual-update-package.ps1 -UpdateZip (Get-ChildItem -Path dist -Filter '*-Update-*.zip' -File | Select-Object -First 1).FullName

      - name: Upload installer and update package as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bedrock-Bot-Console-v${{ steps.version.outputs.value }}
          path: |
            dist/*.exe
            dist/*-Update-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Bedrock Bot Console v${{ steps.version.outputs.value }}
          target_commitish: main
          files: |
            dist/*.exe
            dist/*-Update-*.zip
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            Windows 11 x64 full installer and manual application update package.

            Recommended for existing installations: download the Update ZIP, extract it, then run Apply-Update.bat.
            The update package replaces the application payload (app.asar and any unpacked application files) without reinstalling the Electron runtime.
            Existing application data and authentication cache are preserved.
            Setup.exe remains available as a full-install / recovery option.
            Node.js and npm are not required for normal use.
