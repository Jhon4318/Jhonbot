name: Build Windows Installer

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "src/**"
      - "scripts/**"
      - "test/**"
      - "README.md"
      - ".github/workflows/package-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run syntax checks and unit tests
        run: npm run check

      - name: Build Windows x64 NSIS installer
        run: npm run dist:win

      - name: Verify installer output
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path dist -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one installer, found $($installers.Count)."
          }
          if ($installers[0].Length -lt 10000000) {
            throw "Installer is unexpectedly small ($($installers[0].Length) bytes)."
          }
          $metadata = Join-Path dist "latest.yml"
          $blockmap = Join-Path dist ($installers[0].Name + ".blockmap")
          if (!(Test-Path $metadata -PathType Leaf)) {
            throw "electron-updater metadata latest.yml was not generated."
          }
          if (!(Test-Path $blockmap -PathType Leaf)) {
            throw "NSIS differential update blockmap was not generated."
          }
          Write-Host "Verified $($installers[0].Name) ($($installers[0].Length) bytes), latest.yml, and NSIS blockmap."

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bedrock-Bot-Console-Setup
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Bedrock Bot Console v${{ steps.version.outputs.value }}
          target_commitish: main
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            Windows 11 x64 installer.

            Install mode: current Windows user (no administrator permission normally required).
            Upgrades keep the existing application data and authentication cache.
            electron-updater downloads differential NSIS updates when blockmaps are available.
            Node.js and npm are not required for normal use.
